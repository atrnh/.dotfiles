# AeroSpace replacement for ~/.config/yabai/yabairc.
config-version = 2

start-at-login = true
auto-reload-config = true

after-startup-command = [
    'exec-and-forget borders active_color=0xffca9ee6 inactive_color=0xff414559 width=6.0 blacklist="Codex,petdex-desktop"',
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'accordion'

# Keep SketchyBar in sync when the focused window changes.
on-focus-changed = ['exec-and-forget sketchybar --trigger aerospace_window_change']
on-focused-monitor-changed = []
focus-follows-mouse.enabled = false

persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

# Notify SketchyBar when the focused workspace changes.
exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

# Match yabai's window gaps and padding. AeroSpace already accounts for the menu bar.
gaps.inner.horizontal = 8
gaps.inner.vertical = 8
gaps.outer.left = 8
gaps.outer.bottom = 10
# 16px visible gap plus the 6px border drawn outside the window frame.
gaps.outer.top = 10
gaps.outer.right = 8

# AeroSpace already floats windows it recognizes as dialogs, including Codex dialogs.
on-window-detected = [
  {
    if = '''test %{app-name} ~= "^App Store|^System Settings$|^Install.?|Dashlane|Zoom|^Adobe.*|^Presentify.*|petdex-desktop"''',
    run = 'layout floating',
    check-further-callbacks = true
  },
  {
    if = 'true',
    run = [
      # 'balance-sizes --workspace %{workspace}',
      'exec-and-forget sketchybar --trigger window_created',
      # 'exec-and-forget sketchybar --trigger window_resized',
    ],
  },
]

# AeroSpace does not expose a matching window-destroyed callback.

# Window-manager hotkeys are selected from ~/.config/skhd/skhdrc.
[mode.main.binding]
